# Baut die FM1-Open-Fassung von GrooveDeck auf einem Windows-Rechner von GitHub (kein lokaler Windows-Bau noetig),
# dazu eine Installationsseite (M-VAVEs Web-Updater mit eingebetteter GrooveDeck-Firmware) und das Browser-
# Bedienfeld, und stellt alles auf GitHub Pages: /  (Bedienfeld), /installer.html, /presets.html (Preset-Paket).
# Ergebnis ausserdem als Download ("Artifacts") am Lauf.
name: FM1 Open Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['core/**', 'fm1open/**', 'host/gd_panel_draw.*', 'web/**', '.github/workflows/fm1open.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FM1_OPEN_COMMIT: 4c7496daac04a95ff10d1afdcc8f9ead2dbabc41
    steps:
      - uses: actions/checkout@v4
        with:
          path: GrooveDeck-FM1

      - name: JieLi-Toolchain 2.5.3 (Installer entpacken statt ausfuehren)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\jl-2.5.3.exe"
          curl.exe --fail --location --retry 5 --retry-delay 10 --output $exe https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          Write-Host ("Installer: {0:N0} Byte, SHA256 {1}" -f (Get-Item $exe).Length, (Get-FileHash $exe).Hash)
          $out = "$env:RUNNER_TEMP\jl"
          # Installer-Typ anhand bekannter Kennungen bestimmen
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($m in @('Inno Setup','Nullsoft','7zS.sfx','!@InstallEnd@!','QtIFW','Advanced Installer','InstallShield','Setup Factory','WiX','PK' + [char]3 + [char]4,'7z' + [char]0xBC + [char]0xAF)) {
            $i = $text.IndexOf($m); if ($i -ge 0) { Write-Host ("Kennung '{0}' bei {1:N0}" -f ($m -replace '[^\x20-\x7e]','?'), $i) }
          }
          function Find-Clang { Get-ChildItem $out -Filter clang.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\pi32\\bin\\clang\.exe$' } | Select-Object -First 1 }
          $clang = $null
          if ($text.Contains('Inno Setup')) {
            choco install innoextract -y --no-progress | Out-Null
            innoextract --silent --output-dir $out $exe
            $clang = Find-Clang
          }
          if (!$clang) {
            & 7z x $exe "-o$out" -y | Select-Object -Last 3
            # eingebettete Archive (Ressourcen ohne Endung, .7z, .zip) Stufe fuer Stufe auspacken
            for ($round = 0; $round -lt 3 -and !$clang; ++$round) {
              Get-ChildItem $out -Recurse -File | Where-Object { $_.Length -gt 1MB -and $_.Extension -notin @('.exe','.dll') -or $_.Extension -in @('.7z','.zip') } | ForEach-Object {
                $dest = $_.FullName + '_x'
                if (!(Test-Path $dest)) { & 7z x $_.FullName "-o$dest" -y 2>&1 | Out-Null; Write-Host "versucht: $($_.FullName) ($($_.Length))" }
              }
              $clang = Find-Clang
            }
          }
          if (!$clang) {
            Get-ChildItem $out -Recurse -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 40 Length, FullName | Format-Table -AutoSize | Out-String -Width 300
            throw 'pi32\bin\clang.exe nicht im Installer gefunden'
          }
          $pi32 = Split-Path (Split-Path $clang.FullName)
          Write-Host "Toolchain: $pi32"
          "FM1_PI32_TOOLCHAIN=$pi32" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: FM1 Open holen und GrooveDeck einsetzen
        shell: pwsh
        run: |
          git clone https://github.com/m-vave/fm1_open.git fm1_open
          git -C fm1_open checkout $env:FM1_OPEN_COMMIT
          powershell -NoProfile -ExecutionPolicy Bypass -File GrooveDeck-FM1\fm1open\install.ps1 -Fm1Open "$pwd\fm1_open"

      - name: Bauen
        shell: pwsh
        run: |
          cd fm1_open
          powershell -NoProfile -ExecutionPolicy Bypass -File sdk\Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installationsseiten (M-VAVE-Web-Updater mit eingebetteter Firmware)
        shell: pwsh
        run: |
          # installer.html: GrooveDeck. installer-test.html: unveraendertes FM1 Open aus derselben Bauumgebung
          # (nur eine Markierungsdatei, damit die Kennung abweicht) - Kontrolltest fuer die Bau-/Verpackungskette.
          # Der Simulator der Seiten wird aus unveraendertem FM1 Open gebaut. Ohne Rueckweg-Abbild Original V15.
          git clone https://github.com/m-vave/fm1_open.git fm1_stock
          git -C fm1_stock checkout $env:FM1_OPEN_COMMIT
          git clone https://github.com/m-vave/fm1_open.git fm1_ctrl
          git -C fm1_ctrl checkout $env:FM1_OPEN_COMMIT
          Set-Content fm1_ctrl\app\ci_marker.h "/* GrooveDeck-CI Kontrollbau $env:GITHUB_SHA */"
          Push-Location fm1_ctrl
          powershell -NoProfile -ExecutionPolicy Bypass -File sdk\Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN 2>&1 | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Force installer | Out-Null
          function Make-Installer([string]$tree, [string]$name, [string]$title) {
            $b = "$pwd\$tree\build\dx7"
            $fwFile = "$b\generated\FM1_OFFICIAL_OPEN.fwsc"
            $fw = [IO.File]::ReadAllBytes($fwFile)
            $id = Get-Content "$b\build-identity.json" -Raw | ConvertFrom-Json
            $ver = [IO.File]::ReadAllText("$pwd\$tree\app\version.h")
            $product = [regex]::Match($ver, '(?m)^#define FM1_UPDATE_PRODUCT "(FM-1_8[0-9]{6})"').Groups[1].Value
            $sha = (Get-FileHash $fwFile -Algorithm SHA256).Hash.ToLower()
            $loader = (Get-FileHash "$pwd\$tree\sdk\tools\pack\ota.bin" -Algorithm SHA256).Hash.ToLower()
            $pkg = [ordered]@{schema=1; product=$product; profile=$id.profile; family=7; release_version=$id.release_version;
              build_id=$id.build_id; sha256=$sha; bytes=$fw.Length; loader_sha256=$loader; hardware_validated=$false;
              data=[Convert]::ToBase64String($fw)} | ConvertTo-Json -Depth 4 -Compress
            $src = "https://github.com/acidstefan/GrooveDeck-FM1/archive/$env:GITHUB_SHA.zip"
            Push-Location fm1_stock
            # im selben Prozess: die Firmware als Text ist fuer eine Kommandozeile zu lang
            & .\tools\Build-Web.ps1 -PackageJson $pkg -SourceUrl $src | Out-Host
            $html = [IO.File]::ReadAllText("$pwd\build\official-web\FM1-Official-Open-Source.html")
            Pop-Location
            $html = $html.Replace('<title>FM1 工作台</title>', "<title>$title</title>")
            [IO.File]::WriteAllText("$pwd\installer\$name", $html, (New-Object Text.UTF8Encoding $false))
            Write-Host ("{0}: {1:N0} Byte, Firmware {2:N0} Byte sha {3}, build_id {4}, product {5}" -f $name, $html.Length, $fw.Length, $sha, $id.build_id, $product)
          }
          Make-Installer 'fm1_open' 'installer.html' 'GrooveDeck FM-1 – Installation'
          Make-Installer 'fm1_ctrl' 'installer-test.html' 'Kontrolltest: FM1 Open aus der GrooveDeck-Bauumgebung'

      - name: Groessenbericht
        if: always()
        shell: pwsh
        run: |
          $elf = "fm1_open\build\dx7\sdk.elf"
          if (!(Test-Path $elf)) { Write-Host "kein sdk.elf"; exit 0 }
          $nm = Join-Path $env:FM1_PI32_TOOLCHAIN 'bin\llvm-nm.exe'
          $objdump = Join-Path $env:FM1_PI32_TOOLCHAIN 'bin\llvm-objdump.exe'
          if (Test-Path $objdump) { & $objdump -h $elf | Out-String -Width 300 | Write-Host }
          Write-Host "=== Audio-Interrupt-Pfad (darf nur SRAM-Code aufrufen) ==="
          & $objdump -d $elf 2>$null | Set-Content disasm.txt
          $want = @('gd_render_block','fm1_audio_irq','fm1_output_mix','fm1_audio_copy')
          $show = $false
          foreach ($l in [IO.File]::ReadLines("$pwd\disasm.txt")) {
            if ($l -match '^[0-9a-f]+ <([^>]+)>:') { $show = $want -contains $Matches[1] }
            if ($show) { Write-Host $l }
          }
          Write-Host "=== groesste Symbole ==="
          & $nm --print-size --size-sort --radix=d $elf | Select-Object -Last 70 | Out-String -Width 300 | Write-Host

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groovedeck-fm1open
          if-no-files-found: warn
          path: |
            fm1_open/build-log.txt
            fm1_open/build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc
            fm1_open/build/dx7/firmware-report.json
            fm1_open/build/dx7/sdk.map
            installer/*.html

  pages:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bedienfeld bauen (clang, WebAssembly)
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          sh web/build.sh
          mkdir -p site
          cp web/groovedeck-fm1.html site/index.html
      - uses: actions/download-artifact@v4
        with:
          name: groovedeck-fm1open
          path: art
      - name: Installationsseite dazu
        run: cp "$(find art -name installer.html | head -1)" site/installer.html && cp "$(find art -name installer-test.html | head -1)" site/installer-test.html && cp fm1open/uploader/index.html site/presets.html && ls -l site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
