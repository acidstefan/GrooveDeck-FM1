# Baut die FM1-Open-Fassung von GrooveDeck auf einem Windows-Rechner von GitHub (kein lokaler Windows-Bau noetig).
# Ergebnis als Download ("Artifacts") am Lauf: FM1_OFFICIAL_OPEN.fwsc, firmware-report.json, Protokoll.
name: FM1 Open Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['core/**', 'fm1open/**', '.github/workflows/fm1open.yml']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FM1_OPEN_COMMIT: 4c7496daac04a95ff10d1afdcc8f9ead2dbabc41
    steps:
      - uses: actions/checkout@v4
        with:
          path: GrooveDeck-FM1

      - name: Code::Blocks (verlangt der JieLi-Installer)
        shell: pwsh
        run: |
          choco install codeblocks -y --no-progress
          $cb = Get-ChildItem 'C:\Program Files*\CodeBlocks\codeblocks.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$cb) { throw 'Code::Blocks nicht gefunden' }
          Write-Host "Code::Blocks: $($cb.FullName)"
          # einmal starten und schliessen (legt die Benutzer-Einstellungen an)
          $p = Start-Process -FilePath $cb.FullName -PassThru
          Start-Sleep -Seconds 20
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APPDATA\CodeBlocks" -ErrorAction SilentlyContinue | Format-Table Name

      - name: JieLi-Toolchain 2.5.3
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\jl-2.5.3.exe"
          curl.exe --fail --location --retry 5 --retry-delay 10 --output $exe https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          Write-Host ("Installer: {0:N0} Byte" -f (Get-Item $exe).Length)
          # Installer-Typ unbekannt: zuerst NSIS (/S), dann Inno Setup (/VERYSILENT)
          foreach ($args in @(@('/S','/D=C:\JL'), @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\JL'))) {
            Write-Host "Versuch: $($args -join ' ')"
            $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru
            if (!$p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; Write-Host 'Zeitueberschreitung' }
            Write-Host "Rueckgabe: $($p.ExitCode)"
            $clang = Get-ChildItem C:\JL, "$env:LOCALAPPDATA", "$env:USERPROFILE" -Filter clang.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\pi32\\bin\\clang\.exe$' } | Select-Object -First 1
            if ($clang) { break }
          }
          if (!$clang) {
            Get-ChildItem C:\JL -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
            throw 'pi32\bin\clang.exe nicht gefunden'
          }
          $pi32 = Split-Path (Split-Path $clang.FullName)
          Write-Host "Toolchain: $pi32"
          "FM1_PI32_TOOLCHAIN=$pi32" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: FM1 Open holen und GrooveDeck einsetzen
        shell: pwsh
        run: |
          git clone https://github.com/m-vave/fm1_open.git fm1_open
          git -C fm1_open checkout $env:FM1_OPEN_COMMIT
          powershell -NoProfile -ExecutionPolicy Bypass -File GrooveDeck-FM1\fm1open\install.ps1 -Fm1Open "$pwd\fm1_open"

      - name: Bauen
        shell: pwsh
        run: |
          cd fm1_open
          powershell -NoProfile -ExecutionPolicy Bypass -File sdk\Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groovedeck-fm1open
          if-no-files-found: warn
          path: |
            fm1_open/build-log.txt
            fm1_open/build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc
            fm1_open/build/dx7/firmware-report.json
            fm1_open/build/dx7/sdk.map
