name: Bedienfeld im Browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['core/**', 'host/gd_panel_draw.*', 'web/**', '.github/workflows/web.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang und lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Bauen
        run: |
          sh web/build.sh
          mkdir -p site
          cp web/groovedeck-fm1.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
